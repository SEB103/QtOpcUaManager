name: Qt CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  QT_VERSION: '6.11.1'
  # aqtinstall 3.3.0 (the newest PyPI release) cannot read the per-architecture
  # repository layout Qt introduced with 6.11; the fix (miurahr/aqtinstall#1000)
  # is only on master, so install-qt-action is pointed at a pinned commit.
  # Drop AQTINSTALL_SOURCE once a release newer than 3.3.0 is published.
  AQTINSTALL_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

jobs:
  windows-msvc2022:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # Qt WebView (help viewer) is an optional aqt module; Qt OPC UA is
          # built from source below.
          modules: 'qtwebview'
          aqtsource: ${{ env.AQTINSTALL_SOURCE }}
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # qtopcua is not part of the public Qt online repository for the
      # open-source Windows kits: build it from the matching Git tag.
      - name: Build Qt OPC UA ${{ env.QT_VERSION }} from source
        uses: ./.github/actions/build-qtopcua
        with:
          qt-root: ${{ env.QT_ROOT_DIR }}
          qt-version: ${{ env.QT_VERSION }}

      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DOPCUAMANAGER_COPY_WINDOWS_RUNTIME=OFF

      - name: Build
        run: cmake --build build/ci --parallel

      - name: Run tests
        run: ctest --test-dir build/ci --output-on-failure

      - name: Run QML lint targets
        run: cmake --build build/ci --target all_qmllint
