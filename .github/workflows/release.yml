name: Release

# Builds the Canonical Deployment with packaging/release.ps1 and produces the
# hybrid installer, the portable ZIP and the Qt IFW update repository.
#
#   - push of a tag vX.Y.Z : the tag must equal packaging/product.json "version";
#                            tests run, the pipeline runs, the repogen output is
#                            published to GitHub Pages (updates/stable/), a
#                            GitHub Release with the installer + ZIP is created
#                            and the user manual is pushed to the GitHub Wiki.
#   - workflow_dispatch     : dry run. Same checks, tests and pipeline; the
#                            artifacts are only uploaded to the workflow run.
#                            No Release, no Pages deployment, no version change.
#                            Unsigned unless the "sign" input is set.
#
# Code signing (tag builds, or a dry run with sign=true) is done by SignPath.io
# with the SignPath Foundation certificate for open-source projects. The build
# job submits two signing requests: the project executables before packaging
# (so the installer, the portable ZIP and the update repository all carry
# signed binaries) and the finished Setup.exe afterwards. Each request waits
# for manual approval in SignPath; see packaging/README.md, "Code signing".
# Configuration: secret SIGNPATH_API_TOKEN, repository variables
# SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG.
#
# Nothing is published unless every earlier job (check, test, build) succeeded.
# The version is never derived from the tag; product.json is the only source.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign the dry-run artifacts through SignPath (waits for approval)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  QT_VERSION: '6.11.1'
  # Qt Installer Framework: exact tool variant installed by aqt (4.10.0) and the
  # directory it lands in below $IQTA_TOOLS.
  IFW_TOOL_VARIANT: 'qt.tools.ifw.410'
  IFW_DIR_VERSION: '4.10'
  # aqtinstall 3.3.0 (the newest PyPI release) cannot read the per-architecture
  # repository layout Qt introduced with 6.11; the fix (miurahr/aqtinstall#1000)
  # is only on master, so install-qt-action is pointed at a pinned commit.
  # Drop AQTINSTALL_SOURCE once a release newer than 3.3.0 is published.
  AQTINSTALL_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
  # On Windows, QCommandLineParser shows --help/--version/usage-error text in a
  # message box when the process has no console window (the case for runner
  # steps). The Qt IFW tools (devtool, binarycreator, repogen) would then block
  # forever on the headless runner; this routes the text to stdout/stderr.
  QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Gate: the product version must be X.Y.Z and, for a tag build, equal the tag.
  # Runs before any build so a mismatch fails in seconds and publishes nothing.
  # ---------------------------------------------------------------------------
  check:
    name: Check version and tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.meta.outputs.is_release }}
      sign: ${{ steps.meta.outputs.sign }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read product.json and validate the tag
        id: meta
        shell: bash
        env:
          SIGN_INPUT: ${{ inputs.sign }}
        run: |
          version="$(jq -r '.version' packaging/product.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::packaging/product.json version '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          is_release=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag '$tag' is not of the form vX.Y.Z"
              exit 1
            fi
            if [[ "${tag#v}" != "$version" ]]; then
              echo "::error::tag '$tag' does not match packaging/product.json version '$version'"
              exit 1
            fi
            is_release=true
          fi
          # Releases are always signed; a dry run only when requested.
          sign=false
          if [[ "$is_release" == "true" || "$SIGN_INPUT" == "true" ]]; then
            sign=true
          fi
          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "sign=$sign"             >> "$GITHUB_OUTPUT"
          echo "version=$version is_release=$is_release sign=$sign"

  # ---------------------------------------------------------------------------
  # Tests: the same configure/build/ctest/qmllint run as ci.yml, in its own tree.
  # ---------------------------------------------------------------------------
  test:
    name: Build and test
    timeout-minutes: 60
    needs: check
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # Qt WebView (help viewer) is an optional aqt module; Qt OPC UA is
          # built from source below.
          modules: 'qtwebview'
          aqtsource: ${{ env.AQTINSTALL_SOURCE }}
          cache: true

      - name: Set up MSVC and Ninja
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64

      # qtopcua is not part of the public Qt online repository for the
      # open-source Windows kits: build it from the matching Git tag.
      - name: Build Qt OPC UA ${{ env.QT_VERSION }} from source
        uses: ./.github/actions/build-qtopcua
        with:
          qt-root: ${{ env.QT_ROOT_DIR }}
          qt-version: ${{ env.QT_VERSION }}

      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DOPCUAMANAGER_COPY_WINDOWS_RUNTIME=OFF

      - name: Build
        run: cmake --build build/ci --parallel

      - name: Run tests
        run: ctest --test-dir build/ci --output-on-failure

      - name: Run QML lint targets
        run: cmake --build build/ci --target all_qmllint

  # ---------------------------------------------------------------------------
  # Release pipeline: packaging/release.ps1 -Stage All with a pinned Qt IFW.
  # ---------------------------------------------------------------------------
  build:
    name: Release pipeline
    # Build and packaging take well under an hour; the rest is headroom for
    # the two signing requests, each of which waits for a manual approval.
    timeout-minutes: 300
    needs: check
    runs-on: windows-2022
    permissions:
      contents: read
      # SignPath downloads the unsigned artifact of this run with the job token.
      actions: read
    env:
      SIGN: ${{ needs.check.outputs.sign }}
      # Upper bound for one signing request, approval wait included (2 h).
      SIGNPATH_WAIT_SECONDS: '7200'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt ${{ env.QT_VERSION }} and Qt Installer Framework ${{ env.IFW_DIR_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # Qt WebView (help viewer) is an optional aqt module; Qt OPC UA is
          # built from source below.
          modules: 'qtwebview'
          aqtsource: ${{ env.AQTINSTALL_SOURCE }}
          tools: 'tools_ifw,${{ env.IFW_TOOL_VARIANT }}'
          cache: true

      - name: Set up MSVC and Ninja
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64

      # qtopcua is not part of the public Qt online repository for the
      # open-source Windows kits: build it from the matching Git tag.
      - name: Build Qt OPC UA ${{ env.QT_VERSION }} from source
        uses: ./.github/actions/build-qtopcua
        with:
          qt-root: ${{ env.QT_ROOT_DIR }}
          qt-version: ${{ env.QT_VERSION }}

      - name: Verify Qt Installer Framework
        id: ifw
        shell: pwsh
        run: |
          # aqt installs the tool below $IQTA_TOOLS/QtInstallerFramework/<major.minor>;
          # require the exact binaries and their 4.10.x file version instead of
          # searching the disk.
          $root = Join-Path $env:IQTA_TOOLS "QtInstallerFramework/$env:IFW_DIR_VERSION"
          foreach ($tool in 'binarycreator.exe', 'repogen.exe', 'devtool.exe') {
            $path = Join-Path $root "bin/$tool"
            if (-not (Test-Path $path)) { throw "$tool not found at $path" }
            $fileVersion = (Get-Item $path).VersionInfo.FileVersion
            if (-not $fileVersion -or -not $fileVersion.StartsWith("$env:IFW_DIR_VERSION.")) {
              throw "$tool has version '$fileVersion', expected $env:IFW_DIR_VERSION.x"
            }
            Write-Host "$tool : $fileVersion"
          }
          & (Join-Path $root 'bin/devtool.exe') --version
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The pipeline runs stage by stage so the two signing rounds can be
      # inserted: executables after Deploy/Verify, the installer after packaging.
      - name: Build, deploy and verify the canonical deployment
        shell: pwsh
        run: |
          foreach ($stage in 'Build', 'Deploy', 'Verify') {
            ./packaging/release.ps1 -Stage $stage `
              -CMake cmake -Ninja ninja `
              -QtPrefix "$env:QT_ROOT_DIR" `
              -QtIfwRoot "${{ steps.ifw.outputs.root }}"
            if ($LASTEXITCODE -ne 0) { throw "release.ps1 -Stage $stage failed" }
          }

      # ----- Signing round 1: project executables (before packaging) -----
      - name: Collect unsigned executables
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $meta = Get-Content packaging/product.json -Raw | ConvertFrom-Json
          $deploy = "release/$($meta.artifactBase)-$($meta.version)"
          New-Item -ItemType Directory -Force signing/unsigned-executables | Out-Null
          foreach ($exe in "$($meta.exeName).exe", 'OpcUaServerRuntime.exe') {
            Copy-Item "$deploy/$exe" signing/unsigned-executables/
          }
          Get-ChildItem signing/unsigned-executables

      - name: Upload unsigned executables
        if: env.SIGN == 'true'
        id: upload-unsigned-executables
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-executables
          path: signing/unsigned-executables/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign executables (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.upload-unsigned-executables.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_WAIT_SECONDS }}
          output-artifact-directory: signing/signed-executables

      - name: Install signed executables into the deployment
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          # Replace the unsigned binaries in the canonical deployment, then
          # re-verify it with the signature requirement switched on.
          $meta = Get-Content packaging/product.json -Raw | ConvertFrom-Json
          $deploy = "release/$($meta.artifactBase)-$($meta.version)"
          foreach ($exe in "$($meta.exeName).exe", 'OpcUaServerRuntime.exe') {
            $signed = "signing/signed-executables/$exe"
            if (-not (Test-Path $signed)) { throw "signed executable missing: $signed" }
            Copy-Item $signed "$deploy/$exe" -Force
          }
          ./packaging/verify-deployment.ps1 -DeploymentDir $deploy -RequireSignature
          if ($LASTEXITCODE -ne 0) { throw 'signed deployment verification failed' }

      - name: Package installer, portable ZIP and update repository
        shell: pwsh
        run: |
          foreach ($stage in 'PackageInstaller', 'PackagePortable', 'GenerateRepository') {
            ./packaging/release.ps1 -Stage $stage `
              -CMake cmake -Ninja ninja `
              -QtPrefix "$env:QT_ROOT_DIR" `
              -QtIfwRoot "${{ steps.ifw.outputs.root }}"
            if ($LASTEXITCODE -ne 0) { throw "release.ps1 -Stage $stage failed" }
          }

      # ----- Signing round 2: the installer -----
      - name: Upload unsigned installer
        if: env.SIGN == 'true'
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: release/*-Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_WAIT_SECONDS }}
          output-artifact-directory: signing/signed-installer

      - name: Install the signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $meta = Get-Content packaging/product.json -Raw | ConvertFrom-Json
          $name = "$($meta.artifactBase)-$($meta.version)-Setup.exe"
          $signed = "signing/signed-installer/$name"
          if (-not (Test-Path $signed)) { throw "signed installer missing: $signed" }
          Copy-Item $signed "release/$name" -Force
          $sig = Get-AuthenticodeSignature "release/$name"
          if ($sig.Status -ne 'Valid') { throw "installer signature is $($sig.Status)" }
          Write-Host "Installer signed by: $($sig.SignerCertificate.Subject)"

      - name: Verify artifact versions
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The executable, the IFW package and the artifact names must all carry
          # the product.json version that the check job validated.
          $meta = Get-Content packaging/product.json -Raw | ConvertFrom-Json
          $v = $env:EXPECTED_VERSION
          if ($meta.version -ne $v) { throw "product.json version $($meta.version) != checked version $v" }
          $base = $meta.artifactBase
          $setup = "release/$base-$v-Setup.exe"
          $zip   = "release/$base-$v-win64.zip"
          $exe   = "release/$base-$v/$($meta.exeName).exe"
          $upd   = 'release/repository/Updates.xml'
          foreach ($f in $setup, $zip, $exe, $upd) {
            if (-not (Test-Path $f)) { throw "expected artifact missing: $f" }
          }
          $exeVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $exeVersion.StartsWith($v)) { throw "executable version '$exeVersion' != $v" }
          if (-not (Select-String -Path $upd -Pattern "<Version>$([regex]::Escape($v))</Version>" -Quiet)) {
            throw "Updates.xml does not declare package version $v"
          }
          Write-Host "Version $v consistent across executable, installer, ZIP and repository."

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: release/*-Setup.exe
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: portable
          path: release/*-win64.zip
          if-no-files-found: error

      - name: Upload update repository
        uses: actions/upload-artifact@v7
        with:
          name: repository
          path: release/repository/**
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # GitHub Pages: index.html + the complete repogen output under updates/stable/.
  # Tag builds only. Deployed before the Release so the update repository is
  # online by the time the GitHub Releases API reports the new version.
  # ---------------------------------------------------------------------------
  pages:
    name: Publish update repository (GitHub Pages)
    if: needs.check.outputs.is_release == 'true'
    needs: [check, test, build]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download update repository
        uses: actions/download-artifact@v8
        with:
          name: repository
          path: site/updates/stable

      - name: Assemble site
        shell: bash
        run: |
          cp packaging/pages/index.html site/index.html
          test -f site/updates/stable/Updates.xml
          find site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------------------------
  # GitHub Release for the pushed tag with the installer and the portable ZIP.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: needs.check.outputs.is_release == 'true'
    needs: [check, test, build, pages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist

      - name: Download portable ZIP
        uses: actions/download-artifact@v8
        with:
          name: portable
          path: dist

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -l dist
          {
            echo "OPC UA Manager ${VERSION} for Windows x64."
            echo
            echo '* `*-Setup.exe` - installer (creates the Maintenance Tool for in-place updates).'
            echo '* `*-win64.zip` - portable package (unzip and run; update by replacing the folder).'
            echo
            echo 'Installed copies are updated through **Info > Check for updates...** or the Maintenance Tool.'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "OPC UA Manager ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            dist/*-Setup.exe dist/*-win64.zip

  # ---------------------------------------------------------------------------
  # GitHub Wiki: the user manual (doc/manual/<lang>/*.qdoc, all languages)
  # converted to Markdown by doc/qdoc2wiki.py and pushed to the wiki repository.
  # Runs after the Release so the wiki never documents a version that was not
  # published. The wiki must exist (create its first page once in the web UI);
  # hand-written wiki pages are preserved, only generated pages are replaced.
  # ---------------------------------------------------------------------------
  wiki:
    name: Publish user manual (GitHub Wiki)
    if: needs.check.outputs.is_release == 'true'
    needs: [check, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone wiki repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::Cannot clone ${GITHUB_REPOSITORY}.wiki.git - enable the Wiki and create its first page in the GitHub web UI"
            exit 1
          fi

      - name: Generate wiki pages
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: python3 doc/qdoc2wiki.py --out wiki --clean --version "$VERSION"

      - name: Commit and push
        shell: bash
        working-directory: wiki
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki is already up to date"
            exit 0
          fi
          git commit --quiet -m "docs: user manual for ${VERSION}"
          git push --quiet
